<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#282830">
<title>WebCode Editor</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#1e1e24;--sf:#282830;--ac:#3d7eff;--tx:#e1e1e6;--mu:#8b8b98;--bd:#383842;--er:#ff5c6c;--wa:#f5c542;--ok:#4cd28a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
button,input,select{font:inherit;color:inherit}
#app{display:flex;flex-direction:column;height:var(--vh,100dvh)}
header{display:flex;align-items:center;gap:2px;padding:4px 6px;padding-top:max(4px,env(safe-area-inset-top));background:var(--sf);border-bottom:1px solid var(--bd);min-height:56px}
.ib{background:none;border:0;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;cursor:pointer;flex:none}
.ib:active,.ib:hover{background:rgba(255,255,255,.08)}
.ib.sm{width:32px;height:32px}
.ttl{flex:1;min-width:0;padding:0 6px}
.ttl b{display:block;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl small{display:block;color:var(--mu);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tabs{display:flex;overflow-x:auto;background:var(--bg);border-bottom:1px solid var(--bd);scrollbar-width:none;flex:none}
#tabs::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:8px;padding:0 8px 0 12px;height:40px;flex:none;color:var(--mu);border-bottom:2px solid transparent;cursor:pointer;max-width:210px}
.tab.on{color:var(--tx);background:var(--sf);border-bottom-color:var(--ac)}
.tn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--wa);margin-left:6px}
.tx{background:none;border:0;width:24px;height:24px;border-radius:6px;display:grid;place-items:center;color:inherit;cursor:pointer;padding:0}
.tx:hover{background:rgba(255,255,255,.1)}
.pinic{width:24px;display:grid;place-items:center;color:var(--ac)}
.fi{width:20px;height:20px;border-radius:5px;display:grid;place-items:center;font:700 10px system-ui;flex:none;color:#fff}
.fi.h{background:#e44d26}.fi.c{background:#2965f1}.fi.j{background:#f7df1e;color:#222}.fi.n{background:#7cb342}.fi.p{background:#3776ab}.fi.m{background:#78909c}.fi.t{background:#5c5c6b}
#ew{position:relative;flex:1;min-height:0}
.ace_marker-layer .ace_selection{background:rgba(66,133,214,.62)!important}
.sh{position:absolute;z-index:7;width:26px;height:26px;background:#a8c7fa;border-radius:50%;touch-action:none;display:none;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.sh.s{border-top-right-radius:0}.sh.e{border-top-left-radius:0}
.sh::after{content:"";position:absolute;inset:-14px}
#ew{isolation:isolate;overflow:hidden}
#editor{isolation:isolate;z-index:0}
.ace_scroller,.ace_content,.ace_gutter{touch-action:none}
.ace_gutter-cell{padding-left:2px!important;padding-right:4px!important}
.ace_gutter-cell.ace_error,.ace_gutter-cell.ace_warning{background-position:0 center!important}
#editor{position:absolute;inset:0;font-family:"JetBrains Mono",Menlo,Consolas,monospace}
.prob{position:absolute;right:0;top:10px;z-index:6;display:flex;align-items:center;gap:5px;padding:6px 9px 6px 10px;border-radius:14px 0 0 14px;background:var(--sf);border:1px solid var(--bd);border-right:0;font-size:12px;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.35)}
.prob.err{color:var(--er)}.prob.warn{color:var(--wa)}.prob.ok{color:var(--ok)}
#fab{position:absolute;right:14px;bottom:14px;z-index:6;width:46px;height:46px;border-radius:50%;background:var(--ac);border:0;color:#fff;display:grid;place-items:center;box-shadow:0 4px 14px rgba(61,126,255,.5);cursor:pointer;transition:transform .2s}
#fab.open{transform:rotate(180deg)}
.jmp{position:absolute;right:20px;z-index:6;width:38px;height:38px;border-radius:50%;background:var(--sf);border:1px solid var(--bd);color:var(--tx);display:grid;place-items:center;box-shadow:0 3px 10px rgba(0,0,0,.4);cursor:pointer}
.jmp:active{background:var(--ac)}
#panel{display:none;flex-direction:column;height:42%;flex:none;background:#17171c;border-top:1px solid var(--bd)}
#panel.show{display:flex}
.ph{display:flex;align-items:center;padding:0 6px 0 14px;height:38px;background:var(--sf);font-weight:600;font-size:13px;flex:none}
.ph span{flex:1}
#pbody{flex:1;min-height:0;display:flex;flex-direction:column}
.pane{flex:1;min-height:0;display:flex;flex-direction:column}
.out{flex:1;overflow:auto;padding:8px 12px;font:12.5px/1.5 "JetBrains Mono",monospace;user-select:text;-webkit-user-select:text}
.out div{white-space:pre-wrap;word-break:break-word}
.lg.error{color:var(--er)}.lg.warn{color:var(--wa)}.lg.in{color:var(--mu)}.lg.out{color:#9ad1ff}
.pin{display:flex;align-items:center;gap:8px;padding:0 12px;border-top:1px solid var(--bd);height:42px;flex:none}
.pin input{flex:1;background:none;border:0;outline:0;font:13px "JetBrains Mono",monospace;min-width:0}
#keys,#xk{display:flex;background:var(--sf);border-top:1px solid var(--bd);flex:none}
#keys{padding-bottom:env(safe-area-inset-bottom)}
#xk{display:none;overflow-x:auto;scrollbar-width:none}
#xk.show{display:flex}
#xk::-webkit-scrollbar{display:none}
.k{flex:1;min-width:44px;height:46px;background:none;border:0;display:grid;place-items:center;font:600 12px system-ui;cursor:pointer;user-select:none}
.k:active{background:rgba(255,255,255,.1)}
.k.on{background:var(--ac);color:#fff}
#xk .k{flex:none;min-width:42px;padding:0 10px;font:500 15px "JetBrains Mono",monospace;height:42px}
#xk .k.w{font:600 11px system-ui}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:var(--sf);border-radius:16px;width:min(460px,100%);max-height:88%;display:flex;flex-direction:column;border:1px solid var(--bd);box-shadow:0 20px 60px rgba(0,0,0,.5)}
.card h3{margin:0;padding:16px 18px 6px;font-size:17px}
.cb{padding:8px 18px;overflow:auto}
.cf{display:flex;justify-content:flex-end;gap:8px;padding:10px 12px 14px}
.btn{padding:10px 16px;border-radius:10px;border:0;background:#383842;cursor:pointer}
.btn.p{background:var(--ac);color:#fff}.btn.d{background:#5a2330;color:#ffb3bc}
.inp{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);outline:0;margin:6px 0}
.inp:focus{border-color:var(--ac)}
.opt{display:flex;align-items:center;gap:12px;padding:12px 10px;border-radius:10px;cursor:pointer}
.opt:hover{background:rgba(255,255,255,.05)}
.opt.on{color:var(--ac);font-weight:600}
.opt .rd{margin-left:auto}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border:0}
.row select,.row input[type=number]{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:6px 8px}
.row input[type=range]{width:120px}
.mu{color:var(--mu)}
.mb{position:fixed;inset:0;z-index:40}
.menu{position:absolute;top:58px;right:8px;width:min(310px,calc(100% - 16px));max-height:calc(100% - 72px);overflow:auto;background:var(--sf);border:1px solid var(--bd);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.55);padding:6px}
.mi{display:flex;align-items:center;gap:14px;padding:11px 12px;border-radius:10px;cursor:pointer}
.mi:hover,.mi:active{background:rgba(255,255,255,.07)}
.mi .r{margin-left:auto;color:var(--mu);font-size:12px}
.sep{height:1px;background:var(--bd);margin:5px 6px}
.cbx{width:18px;height:18px;border-radius:5px;border:2px solid var(--mu);margin-left:auto;display:grid;place-items:center}
.cbx.on{background:var(--ac);border-color:var(--ac);color:#fff}
#dr{position:fixed;top:0;bottom:0;left:0;width:min(310px,86%);transform:translateX(-102%);transition:transform .25s;z-index:45;background:var(--sf);border-right:1px solid var(--bd);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
#dr.open{transform:none}
#drb{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:44;display:none}
#drb.open{display:block}
.dh{display:flex;align-items:center;padding:8px 8px 8px 16px;font-weight:600;font-size:16px}
.dh span{flex:1}
#dl{flex:1;overflow:auto;padding:4px 8px}
.di{display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:10px;cursor:pointer}
.di.on{background:rgba(61,126,255,.16)}
.di .dn{flex:1;min-width:0}.di b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.di small{color:var(--mu);font-size:11px}
#run{position:fixed;inset:0;z-index:60;background:var(--bg);display:none;flex-direction:column}
#run.open{display:flex}
#run header{min-height:52px}
#frame{flex:1;border:0;background:#fff;min-height:0;width:100%}
#rc{height:34%;display:none;flex-direction:column;background:#17171c;border-top:1px solid var(--bd);flex:none}
#rc.show{display:flex}
#toast{position:fixed;left:50%;bottom:130px;transform:translateX(-50%) translateY(20px);background:#000d;color:#fff;padding:10px 16px;border-radius:22px;z-index:99;opacity:0;pointer-events:none;transition:.25s;max-width:88%;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
.pr{display:flex;gap:10px;padding:10px 4px;border-bottom:1px solid var(--bd);cursor:pointer;align-items:flex-start}
.pr:last-child{border:0}
.pd{width:9px;height:9px;border-radius:50%;margin-top:5px;flex:none}
.pd.error{background:var(--er)}.pd.warning{background:var(--wa)}.pd.info{background:var(--ac)}
.hl{padding:6px 0}.hl kbd{background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:1px 6px;font:12px "JetBrains Mono",monospace}
.ace_search{z-index:5!important;background:var(--sf)!important;color:var(--tx)!important;border:1px solid var(--bd)!important;border-top:0!important}
.ace_search_field{background:var(--bg)!important;color:var(--tx)!important;border:1px solid var(--bd)!important}
.ace_search .ace_button,.ace_searchbtn,.ace_replacebtn{color:var(--tx)!important;background:#383842!important;border-color:var(--bd)!important}
.ace_search .ace_button:hover{background:#44444f!important}
.ace_searchbtn_close{background:none!important}
.ace_tooltip,.ace_editor.ace_autocomplete{background:var(--sf)!important;color:var(--tx)!important;border:1px solid var(--bd)!important}
.ace_editor.ace_autocomplete .ace_marker-layer .ace_active-line{background:rgba(61,126,255,.35)!important}
.ace_gutter-cell.ace_error,.ace_gutter-cell.ace_warning{background-position:2px center}
#sb{display:none;flex:none;flex-direction:column;gap:4px;background:var(--sf);border-top:1px solid var(--bd);padding:5px 6px}
#sb .r{display:flex;align-items:center;gap:4px}
#sb input[type=text]{flex:1;min-width:0;height:32px;background:#16161b;color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:0 8px;font:14px "JetBrains Mono",monospace;outline:none}
#sb input[type=text]:focus{border-color:var(--ac)}
#sb button{flex:none;width:34px;height:32px;display:grid;place-items:center;background:transparent;color:var(--tx);border:0;border-radius:6px;font-size:18px;padding:0}
#sb button:active{background:var(--bd)}
#sb button.on{background:var(--ac);color:#fff}
#sb .cnt{flex:none;min-width:64px;text-align:right;color:var(--mu);font:12px system-ui;padding-right:4px}
#sbO{display:none}
#sbO button{width:auto;padding:0 10px;font:600 13px "JetBrains Mono",monospace;border:1px solid var(--bd)}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.9/ace.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.9/ext-language_tools.js"></script>
</head>

  </div>
  <div id="panel"><div class="ph"><span id="pt">Console</span><button class="ib sm" id="pClr"></button><button class="ib sm" id="pX"></button></div><div id="pbody"></div></div>
  <div id="keys"></div>
</div>

<div id="drb"></div>
<aside id="dr">
  <div class="dh"><span>Workspace</span><button class="ib sm" id="dNew"></button><button class="ib sm" id="dOpen"></button><button class="ib sm" id="dX"></button></div>
  <div style="padding:0 12px 6px"><input class="inp" id="dq" placeholder="Filter files…"></div>
  <div id="dl"></div>
  <input type="file" id="fileIn" multiple hidden>
</aside>

<div id="run">
  <header>
    <button class="ib" id="rX"></button>
    <div class="ttl"><b id="rt">Preview</b><small>Sandboxed preview</small></div>
    <button class="ib" id="rR"></button>
    <button class="ib" id="rC"></button>
    <button class="ib" id="rM"></button>
  </header>
  <iframe id="frame" sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-popups allow-downloads"></iframe>
  <div id="rc"><div class="ph"><span>Console</span><button class="ib sm" id="rcClr"></button></div><div class="out" id="rlogs"></div></div>
</div>
<div id="toast"></div>

cframe.srcdoc='<!doctype html><html><head>'+capture+`<script>function fmt(r){try{if(r===undefined)return'undefined';if(typeof r==='function')return String(r);if(typeof r==='object'&&r!==null)return JSON.stringify(r,null,1);return String(r)}catch(e){return String(r)}}
addEventListener('message',function(e){var d=e.data;if(!d||!d.__mev)return;function ok(v){parent.postMessage({__mres:1,ok:1,v:fmt(v)},'*')}try{var r=(0,eval)(d.code);if(r&&typeof r.then==='function')r.then(ok,function(x){parent.postMessage({__mres:1,ok:0,v:String(x)},'*')});else ok(r)}catch(x){parent.postMessage({__mres:1,ok:0,v:String(x)},'*')}});<\/script></head><body></body></html>`;

let panelType=null;
function addLog(type,text){
logs.push({type,text});if(logs.length>500)logs.shift();
[consoleEl.querySelector('#clogs'),$('#rlogs')].forEach(c=>{if(!c)return;const d=document.createElement('div');d.className='lg '+type;d.textContent=text;c.appendChild(d);c.scrollTop=c.scrollHeight});
if(type==='error'&&$('#run').classList.contains('open'))$('#rc').classList.add('show');
}
function clearLogs(){logs.length=0;consoleEl.querySelector('#clogs').innerHTML='';$('#rlogs').innerHTML=''}
window.addEventListener('message',e=>{
const d=e.data;if(!d||typeof d!=='object')return;
if(d.__mce&&(e.source===$('#frame').contentWindow||e.source===cframe.contentWindow))addLog(d.t==='log'||d.t==='info'||d.t==='debug'?'log':d.t,d.a.join(' '));
if(d.__mres&&e.source===cframe.contentWindow)addLog(d.ok?'out':'error',(d.ok?'← ':'✖ ')+d.v);
});
$('#cin',consoleEl).addEventListener('keydown',e=>{if(e.key!=='Enter')return;const v=e.target.value.trim();if(!v)return;e.target.value='';addLog('in','› '+v);cframe.contentWindow.postMessage({__mev:1,code:v},'*')});
function openPanel(t){

let cwd='/workspace',thist=[],thi=0;
function tprint(t,cls){const d=document.createElement('div');if(cls)d.className='lg '+cls;d.textContent=t;const o=$('#tout',termEl);o.appendChild(d);o.scrollTop=o.scrollHeight}
const findByName=n=>S.files.find(f=>f.name===n);
function tcmd(line){
tprint(cwd+' $ '+line,'in');
const [c,...a]=line.trim().split(/\s+/);if(!c)return;
switch(c){
case'help':tprint('help ls cat touch rm mv echo pwd date whoami clear open run node');break;
case'ls':sync();tprint(S.files.map(f=>f.name+(f.dirty?'*':'')).join('  ')||'(empty)');break;
case'pwd':tprint(cwd);break;
case'date':tprint(new Date().toString());break;
case'whoami':tprint('developer');break;
case'echo':tprint(a.join(' '));break;
case'clear':$('#tout',termEl).innerHTML='';break;
case'cat':{sync();const f=findByName(a[0]);f?tprint(f.content):tprint('cat: '+a[0]+': No such file','error')}break;
case'touch':if(!a[0])tprint('touch: missing name','error');else if(findByName(a[0]))tprint('exists','warn');else{addFile(a[0],'',{isNew:false,path:'/workspace/'+a[0]});tprint('created '+a[0])}break;
case'rm':{const f=findByName(a[0]);if(f){removeFile(f.id,false);tprint('removed '+a[0])}else tprint('rm: '+a[0]+': No such file','error')}break;
case'mv':{const f=findByName(a[0]);if(f&&a[1]){f.name=a[1];f.mode=modeOf(a[1]);f.path='/workspace/'+a[1];sessions[f.id]&&sessions[f.id].setMode('ace/mode/'+f.mode);paint();persist()}else tprint('usage: mv old new','error')}break;
case'open':{const f=findByName(a[0]);f?openFile(f.id):tprint('open: not found','error')}break;
case'run':{if(a[0]){const f=findByName(a[0]);if(f)openFile(f.id)}run()}break;
case'node':case'python':case'python3':tprint(c+': not available in browser — use the ▶ button or Console for JavaScript','warn');break;
default:tprint(c+': command not found','error');
}
}
$('#tin',termEl).addEventListener('keydown',e=>{
if(e.key==='Enter'){const v=e.target.value;e.target.value='';if(v.trim())thist.push(v);thi=thist.length;tcmd(v)}
else if(e.key==='ArrowUp'){if(thi>0){thi--;e.target.value=thist[thi]}e.preventDefault()}
else if(e.key==='ArrowDown'){thi=Math.min(thi+1,thist.length);e.target.value=thist[thi]||'';e.preventDefault()}
});

/* ---------- run engine ---------- */
let proc=null;
function inlineAssets(h){
const by=n=>S.files.find(x=>x.name===n.split('/').pop().split('?')[0]);
const ext=u=>/^(https?:)?\/\//.test(u)||/^data:/.test(u);
h=h.replace(/<link\b[^>]*>/gi,m=>{const u=(m.match(/href=["']([^"']+)["']/i)||[])[1];if(!u||!/stylesheet/i.test(m)||ext(u))return m;const x=by(u);return x?'<style>/* '+x.name+' */\n'+x.content+'\n</style>':m});
h=h.replace(/<script\b([^>]*?)\bsrc=["']([^"']+)["']([^>]*)>\s*<\/script>/gi,(m,a,u,b)=>{if(ext(u))return m;const x=by(u);return x?'<script'+a+b+'>\n'+x.content.replace(/<\/script/gi,'<\\/script')+'\n<\/script>':m});
return h;
}
function buildDoc(f){
let h;
if(f.mode==='html')h=f.content;
else if(f.mode==='css'||f.mode==='javascript'){
const hf=S.files.find(x=>x.name==='index.html')||S.files.find(x=>x.mode==='html');
if(hf)h=hf.content;
else h=f.mode==='css'?'<!doctype html><html><head><style>'+f.content+'</style></head><body><h1>Heading</h1><p>Paragraph text</p><button>Button</button></body></html>':'<!doctype html><html><head><meta charset="utf-8"></head><body><script>\n'+f.content.replace(/<\/script/gi,'<\\/script')+'\n<\/script></body></html>';
}else if(f.mode==='markdown'||f.mode==='text'||f.mode==='json'||f.mode==='xml')h='<!doctype html><meta name="viewport" content="width=device-width"><body style="font:14px/1.5 monospace;padding:16px;white-space:pre-wrap">'+esc(f.content)+'</body>';
else return null;
h=inlineAssets(h);
return /<head[^>]*>/i.test(h)?h.replace(/<head[^>]*>/i,m=>m+capture):capture+h;
}
function run(){
sync();const f=cur(),h=buildDoc(f);
if(h==null){toast('Run not supported for '+LBL[f.mode]);return}
try{window.closeSB()}catch(e){}proc={id:uid(),name:f.name,t:Date.now()};clearLogs();
$('#rt').textContent=f.name;$('#frame').srcdoc=h;$('#run').classList.add('open');$('#rc').classList.remove('show');
}
$('#bRun').onclick=run;
$('#rM').onclick=()=>$('#run').classList.remove('open');

function killProc(){$('#frame').srcdoc='';proc=null;$('#run').classList.remove('open')}
$('#rR').onclick=()=>{const f=cur();const h=buildDoc(f)||buildDoc(S.files.find(x=>x.mode==='html')||f);if(h){clearLogs();$('#frame').srcdoc=h}};

const loaded={};
function loadScript(u){return loaded[u]||(loaded[u]=new Promise((res,rej)=>{const s=document.createElement('script');s.src=u;s.onload=res;s.onerror=()=>rej(new Error('load failed'));document.head.appendChild(s)}))}
async function formatCode(){
const f=cur();sync();const s=editor.session;let out;const o={indent_size:S.settings.tabSize,indent_char:S.settings.softTabs?' ':'\t',wrap_line_length:0};
try{
if(f.mode==='json')out=JSON.stringify(JSON.parse(f.content),null,S.settings.tabSize);
else if(['html','xml','css','javascript','typescript'].includes(f.mode)){
const B='https://cdnjs.cloudflare.com/ajax/libs/js-beautify/1.15.1/';
toast('Formatting…');
await Promise.all([loadScript(B+'beautify.min.js'),loadScript(B+'beautify-css.min.js'),loadScript(B+'beautify-html.min.js')]);
out=f.mode==='css'?css_beautify(f.content,o):(f.mode==='html'||f.mode==='xml')?html_beautify(f.content,o):js_beautify(f.content,o);
}else{toast('No formatter for '+LBL[f.mode]);return}
}catch(e){toast('Format failed: '+e.message);return}
const last=s.getLength()-1;
s.replace({start:{row:0,column:0},end:{row:last,column:s.getLine(last).length}},out);toast('Formatted');
}

function findFile(){
const w=document.createElement('div');
w.innerHTML='<input class="inp" id="fq" placeholder="Search file names & content…" autocapitalize="off"><div id="fr"></div>';

const K={ctrl:false,shift:false};let shA=null;
function pasteText(){
const bridge=()=>{
try{
const A=window.AppInventor;
if(A&&A.setWebViewString&&A.getWebViewString){
A.setWebViewString('@@PASTE@@');
let n=0;const iv=setInterval(()=>{
let v='';try{v=A.getWebViewString()||''}catch(e){}
if(v.indexOf('@@CLIP@@')===0){clearInterval(iv);const t=v.slice(8);try{A.setWebViewString('')}catch(e){}if(t)editor.insert(t);else toast('Clipboard empty')}
else if(++n>20){clearInterval(iv);nat()}
},150);return;
}
}catch(e){}
nat();
};
const nat=()=>{
try{const ta=editor.textInput.getElement();window._kbHold=true;ta.setAttribute('inputmode','text');editor.focus();const ok=document.execCommand('paste');setTimeout(()=>{window._kbHold=false},500);if(ok)return}catch(e){}
if(window._lastClip){editor.insert(window._lastClip);toast('Pasted');return}toast('Keyboard ke clipboard chip par tap karein');
};
if(navigator.clipboard&&navigator.clipboard.readText){navigator.clipboard.readText().then(t=>{if(t)editor.insert(t);else bridge()},bridge)}else bridge();
}
function clip(t){window._lastClip=t;return(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).catch(()=>{const a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(e){}a.remove()})}
const KEYS=[
{id:'ctrl',l:'CTRL',fn:()=>{K.ctrl=!K.ctrl}},
{id:'tab',h:ic('tab',20),fn:()=>editor.execCommand('indent')},
{id:'shift',l:'SHIFT',fn:()=>{K.shift=!K.shift;shA=null;if(K.shift){const c=editor.getCursorPosition();shA={row:c.row,column:c.column};editor.selection.clearSelection();toast('Shift on — tap end point')}}},
{id:'undo',h:ic('undo',20),fn:()=>editor.undo()},
{id:'redo',h:ic('redo',20),fn:()=>editor.redo()},
{id:'find',h:ic('search',20),fn:()=>editor.execCommand('find')},
{id:'save',h:ic('save',20),fn:()=>saveFile(cur())},
{id:'esc',l:'ESC',fn:()=>{closeMenu();closeDrawer();editor.blur();const s=$('.ace_search');s&&editor.searchBox&&editor.searchBox.hide()}}
];
const kb=$('#keys');
KEYS.forEach(k=>{const b=document.createElement('button');b.className='k';b.dataset.id=k.id;b.innerHTML=k.h||k.l;b.onmousedown=e=>e.preventDefault();b.onclick=()=>{k.fn();paintKeys()};kb.appendChild(b)});
function paintKeys(){kb.querySelector('[data-id=ctrl]').classList.toggle('on',K.ctrl);kb.querySelector('[data-id=shift]').classList.toggle('on',K.shift)}
const arrow=d=>()=>K.shift?editor.getSelection()['select'+d]():editor['navigate'+d](1);
const XK=[
{l:'◀',fn:arrow('Left')},{l:'▲',fn:arrow('Up')},{l:'▼',fn:arrow('Down')},{l:'▶',fn:arrow('Right')},
{l:'HOME',w:1,fn:()=>K.shift?editor.getSelection().selectLineStart():editor.navigateLineStart()},
{l:'END',w:1,fn:()=>K.shift?editor.getSelection().selectLineEnd():editor.navigateLineEnd()},
{l:'ALL',w:1,fn:()=>editor.selectAll()},
{l:'COPY',w:1,fn:()=>{const t=editor.getSelectedText();if(!t){toast('Nothing selected');return}clip(t).then(()=>toast('Copied'))}},
{l:'CUT',w:1,fn:()=>{const t=editor.getSelectedText();if(!t){toast('Nothing selected');return}clip(t).then(()=>{editor.insert('');toast('Cut')})}},
{l:'PASTE',w:1,fn:pasteText},
{l:'DUP',w:1,fn:()=>editor.copyLinesDown()},
{l:'//',fn:()=>editor.toggleCommentLines()},
{l:'GOTO',w:1,fn:gotoLine},
...'{}()[]<>;:"\'=/\\|&!?_-+*#$%,.@~`^'.split('').map(ch=>({l:ch,fn:()=>{if(K.ctrl&&ctrlKey(ch))return;editor.insert(ch)}}))
];
function jumpTo(top){
const pos=top?{row:0,column:0}:{row:editor.session.getLength()-1,column:editor.session.getLine(editor.session.getLength()-1).length};
if(K.shift&&shA){editor.selection.setSelectionAnchor(shA.row,shA.column);editor.selection.selectToPosition(pos)}else{editor.selection.clearSelection();editor.moveCursorToPosition(pos)}
editor.renderer.scrollCursorIntoView(pos,top?0:1);
editor.renderer.scrollToLine(top?0:pos.row,false,false,()=>{});
editor.focus();
}
$('#jUp').innerHTML=ic('up',22);$('#jDn').innerHTML=ic('down',22);
[['#jUp',true],['#jDn',false]].forEach(([id,t])=>{const b=$(id);b.onmousedown=e=>e.preventDefault();b.onclick=()=>jumpTo(t)});

/* sticky ctrl/shift for physical & soft keyboards */
const CM={a:()=>editor.selectAll(),z:()=>editor.undo(),y:()=>editor.redo(),f:()=>editor.execCommand('find'),s:()=>saveFile(cur()),d:()=>editor.copyLinesDown(),'/':()=>editor.toggleCommentLines(),g:gotoLine,c:()=>XK[7].fn(),x:()=>XK[8].fn(),v:()=>XK[9].fn(),p:findFile,r:run};
function ctrlKey(ch){const f=CM[String(ch).toLowerCase()];if(!f)return false;f();K.ctrl=false;paintKeys();return true}
editor.container.addEventListener('keydown',ev=>{
if(K.ctrl&&ev.key&&ev.key.length===1&&ctrlKey(ev.key)){ev.preventDefault();ev.stopPropagation();return}
if(K.shift&&ev.key&&ev.key.startsWith('Arrow')&&!ev.shiftKey){ev.preventDefault();ev.stopPropagation();editor.getSelection()['select'+ev.key.slice(5)]()}
},true);
editor.textInput.getElement().addEventListener('beforeinput',ev=>{if(K.ctrl&&ev.data&&ev.data.length===1&&ctrlKey(ev.data))ev.preventDefault()},true);
(function(){
const box=editor.container;let last=0,T=null,raf=0;
const skip=t=>t.closest&&t.closest('.ace_scrollbar,.ace_search,.ace_autocomplete,.ace_fold-widget,.ace_tooltip');
function tap(x,y){
if(Date.now()-last<250)return;last=Date.now();
const p=editor.renderer.screenToTextCoordinates(x,y);
if(!shA)shA={row:p.row,column:p.column};
const put=()=>{editor.selection.setSelectionAnchor(shA.row,shA.column);editor.selection.selectToPosition(p)};
put();setTimeout(put,60);setTimeout(put,300);
toast('Selected — drag handles / Copy / Cut');
}
function stop(ev){ev.stopPropagation()}
box.addEventListener('touchstart',ev=>{
if(skip(ev.target)||ev.touches.length>1){T=null;return}
stop(ev);cancelAnimationFrame(raf);
const t=ev.touches[0];
T={x:t.clientX,y:t.clientY,lx:t.clientX,ly:t.clientY,t0:Date.now(),lt:Date.now(),moved:false,vx:0,vy:0,lp:false};
T.timer=setTimeout(()=>{if(!T||T.moved||K.shift)return;T.lp=true;const p=editor.renderer.screenToTextCoordinates(T.x,T.y);editor.moveCursorToPosition(p);editor.selection.selectWord();editor.focus()},450);
},{capture:true,passive:true});
box.addEventListener('touchmove',ev=>{
if(!T)return;stop(ev);
const t=ev.touches[0];
if(!T.moved&&Math.hypot(t.clientX-T.x,t.clientY-T.y)>8){T.moved=true;clearTimeout(T.timer);T.axis=Math.abs(t.clientX-T.x)>Math.abs(t.clientY-T.y)?'x':'y'}
if(T.moved){
if(ev.cancelable)ev.preventDefault();
const now=Date.now(),dt=Math.max(1,now-T.lt),dx=T.axis==='y'?0:t.clientX-T.lx,dy=T.axis==='x'?0:t.clientY-T.ly;
editor.renderer.scrollBy(-dx,-dy);
T.vx=-dx/dt*.6+T.vx*.4;T.vy=-dy/dt*.6+T.vy*.4;
T.lx=t.clientX;T.ly=t.clientY;T.lt=now;
}
},{capture:true,passive:false});
box.addEventListener('touchend',ev=>{
if(!T)return;stop(ev);
clearTimeout(T.timer);const c=T;T=null;
if((c.moved||c.lp||K.shift)&&ev.cancelable)ev.preventDefault();
if(c.moved){
if(Date.now()-c.lt>80)return;
let vx=c.vx*16,vy=c.vy*16;
const step=()=>{vx*=.95;vy*=.95;if(Math.abs(vx)<.4&&Math.abs(vy)<.4)return;editor.renderer.scrollBy(vx,vy);raf=requestAnimationFrame(step)};
raf=requestAnimationFrame(step);return;
}
if(c.lp)return;
if(K.shift)tap(c.x,c.y);
else{const ta=editor.textInput.getElement();window._kbHold=true;ta.setAttribute('inputmode','text');ta.blur();setTimeout(()=>{window._kbHold=false},500)}
},{capture:true,passive:false});
box.addEventListener('touchcancel',()=>{if(T){clearTimeout(T.timer);T=null}},true);
box.addEventListener('mousedown',ev=>{if(K.shift&&!skip(ev.target)){ev.preventDefault();ev.stopPropagation()}},true);
box.addEventListener('click',ev=>{if(!K.shift||skip(ev.target))return;ev.preventDefault();ev.stopPropagation();tap(ev.clientX,ev.clientY)},true);
})();
editor.commands.addCommand({name:'saveFile',bindKey:{win:'Ctrl-S',mac:'Command-S'},exec:()=>saveFile(cur())});
editor.commands.addCommand({name:'runCode',bindKey:{win:'Ctrl-Enter',mac:'Command-Enter'},exec:run});
editor.commands.addCommand({name:'findFile',bindKey:{win:'Ctrl-P',mac:'Command-P'},exec:findFile});
editor.commands.addCommand({name:'gotoLineX',bindKey:{win:'Ctrl-L',mac:'Command-L'},exec:gotoLine});

/* ---------- selection handles ---------- */
(function(){
const ew=document.getElementById('ew'),hS=document.getElementById('hS'),hE=document.getElementById('hE');
let drag=null;
function place(h,pos){
const r=editor.renderer,c=r.textToScreenCoordinates(pos.row,pos.column),b=ew.getBoundingClientRect();
const x=c.pageX-b.left-window.pageXOffset,y=c.pageY-b.top-window.pageYOffset+r.lineHeight;
const gx=r.gutterWidth||0;
if(x<gx-1||x>b.width||y<0||y>b.height+r.lineHeight){h.style.display='none';return}
h.style.display='block';
h.style.left=(h.classList.contains('s')?x-26:x)+'px';
h.style.top=(y-2)+'px';
}
function upd(){
if(editor.selection.isEmpty()){hS.style.display=hE.style.display='none';return}
const rg=editor.selection.getRange();place(hS,rg.start);place(hE,rg.end);
}
editor.renderer.on('afterRender',upd);
editor.selection.on('changeSelection',upd);editor.on('changeSession',()=>{editor.selection.on('changeSelection',upd);upd()});
[hS,hE].forEach(h=>{
h.addEventListener('pointerdown',e=>{
e.preventDefault();e.stopPropagation();
const rg=editor.selection.getRange();
drag={fixed:h===hS?{row:rg.end.row,column:rg.end.column}:{row:rg.start.row,column:rg.start.column}};
h.setPointerCapture(e.pointerId);
});
h.addEventListener('pointermove',e=>{
if(!drag)return;e.preventDefault();
const r=editor.renderer,b=ew.getBoundingClientRect();
if(e.clientY<b.top+40)editor.renderer.scrollBy(0,-20);else if(e.clientY>b.bottom-60)editor.renderer.scrollBy(0,20);
const p=r.screenToTextCoordinates(e.clientX,e.clientY-r.lineHeight*1.2);
editor.selection.setSelectionAnchor(drag.fixed.row,drag.fixed.column);editor.selection.selectToPosition(p);
});
const end=()=>{drag=null};
h.addEventListener('pointerup',end);h.addEventListener('pointercancel',end);
});
})();

/* ---------- compact search bar ---------- */
(function(){
const sb=document.getElementById('sb'),F=document.getElementById('sbF'),R=document.getElementById('sbR'),C=document.getElementById('sbC');
const opts={cs:false,ww:false,re:false};
const so=()=>({needle:F.value,caseSensitive:opts.cs,wholeWord:opts.ww,regExp:opts.re,wrap:true});
function count(){
if(!F.value){C.textContent='';return}
let rs=[];try{const S=ace.require('ace/search').Search;const q=new S();q.set(so());rs=q.findAll(editor.session)}catch(e){}
const sel=editor.getSelectionRange();let i=rs.findIndex(r=>r.isEqual(sel));
C.textContent=(i>=0?i+1:0)+' of '+rs.length;
}
function go(back,keep){
if(!F.value){C.textContent='';return}
try{editor.find(F.value,Object.assign(so(),{backwards:back,skipCurrent:!keep}),false)}catch(e){}
count();
}
function open(){
sb.style.display='flex';
const t=editor.getSelectedText();if(t&&t.indexOf('\n')<0)F.value=t;
editor.resize();F.focus();F.select();count();
}
function close(){if(sb.style.display==='none')return;sb.style.display='none';editor.resize();editor.focus()}
window.closeSB=()=>{sb.style.display='none';try{editor.resize()}catch(e){}};
editor.commands.addCommand({name:'find',bindKey:{win:'Ctrl-F',mac:'Command-F'},exec:open,readOnly:true});
editor.commands.addCommand({name:'replace',bindKey:{win:'Ctrl-H',mac:'Command-Option-F'},exec:()=>{open();R.focus()},readOnly:true});
F.addEventListener('input',()=>{const r=editor.getSelectionRange();editor.selection.moveTo(r.start.row,r.start.column);go(false,true)});
F.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();go(e.shiftKey)}else if(e.key==='Escape')close()});
R.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();doRep()}else if(e.key==='Escape')close()});
function doRep(){if(!F.value)return;try{editor.replace(R.value,so())}catch(e){}go(false,true)}
document.getElementById('sbN').onclick=()=>go(false);
document.getElementById('sbP').onclick=()=>go(true);
document.getElementById('sbX').onclick=close;
document.getElementById('sbRe').onclick=doRep;
})();

$('#bMenu').innerHTML=ic('menu');$('#bEdit').innerHTML=ic('pencil');$('#bRun').innerHTML=ic('play');$('#bMore').innerHTML=ic('dots');
$('#pX').innerHTML=ic('x',16);$('#pClr').innerHTML=ic('trash',15);
$('#dNew').innerHTML=ic('fplus',18);$('#dOpen').innerHTML=ic('open',18);$('#dX').innerHTML=ic('x',18);
$('#rX').innerHTML=ic('x');$('#rR').innerHTML=ic('redo',20);$('#rC').innerHTML=ic('term',20);$('#rM').innerHTML=ic('min');$('#rcClr').innerHTML=ic('trash',15);
applySettings();
openFile(S.active,false);
editor.renderer.on('afterRender',()=>{});
})();
